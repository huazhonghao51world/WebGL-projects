<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dengta WebGL2 诊断</title>
<style>body{font:16px system-ui;max-width:1050px;margin:35px auto;padding:0 20px;background:#eef2f6;color:#172b43}button,a{padding:10px;margin:5px}pre{white-space:pre-wrap;background:#fff;padding:20px;border:1px solid #bcc9d8}canvas{width:200px;height:100px;border:1px solid #999;margin:6px}h1{font-size:25px}</style>
<h1>dengta 本机 WebGL2 诊断</h1><p>分别创建默认上下文与项目参数上下文，并执行着色器三角形绘制和像素回读。本页通过仍需验收真实工厂场景。</p>
<button onclick="run()">重新检测</button><button onclick="save()">保存诊断 JSON</button><a href="/#/page_2/2" target="_blank">打开工厂场景</a><div id="canvases"></div><pre id="result"></pre>
<script>
let report;
function test(name,attributes){
 const canvas=document.createElement('canvas');canvas.width=200;canvas.height=100;document.querySelector('#canvases').append(canvas);
 const out={name,requestedAttributes:attributes,creationErrors:[]};
 canvas.addEventListener('webglcontextcreationerror',e=>out.creationErrors.push(e.statusMessage));
 try{const gl=canvas.getContext('webgl2',attributes);out.contextCreated=!!gl;if(!gl)return out;
 out.attributes=gl.getContextAttributes();out.version=gl.getParameter(gl.VERSION);out.shadingLanguage=gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
 const debug=gl.getExtension('WEBGL_debug_renderer_info');out.vendor=gl.getParameter(debug?debug.UNMASKED_VENDOR_WEBGL:gl.VENDOR);out.renderer=gl.getParameter(debug?debug.UNMASKED_RENDERER_WEBGL:gl.RENDERER);
 out.extensions=gl.getSupportedExtensions();out.maxTextureSize=gl.getParameter(gl.MAX_TEXTURE_SIZE);
 const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
 const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 v[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));gl_Position=vec4(v[gl_VertexID],0.,1.);}'));
 gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(0.,1.,0.,1.);}'));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
 gl.useProgram(p);gl.viewport(0,0,200,100);gl.drawArrays(gl.TRIANGLES,0,3);const pixel=new Uint8Array(4);gl.readPixels(100,50,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);out.pixel=Array.from(pixel);out.glError=gl.getError();out.drawPassed=pixel[1]>240&&pixel[0]<10&&out.glError===0;
 }catch(e){out.error=String(e);}return out;
}
async function run(){document.querySelector('#canvases').replaceChildren();report={time:new Date().toISOString(),userAgent:navigator.userAgent,platform:navigator.platform,secureContext:isSecureContext,hardwareConcurrency:navigator.hardwareConcurrency,devicePixelRatio,tests:[]};
 report.tests.push(test('default',{}));report.tests.push(test('SDK three.js r180 actual context attributes',{alpha:true,depth:true,stencil:false,antialias:true,premultipliedAlpha:true,preserveDrawingBuffer:false,powerPreference:'high-performance',failIfMajorPerformanceCaveat:false}));
 try{report.server=await(await fetch('/health')).json();}catch(e){report.serverError=String(e);}document.querySelector('#result').textContent=JSON.stringify(report,null,2);window.__webglReport=report;}
function save(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='dengta-webgl2-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}run();
</script></html>
